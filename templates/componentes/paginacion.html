{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="{{ etiqueta|default:'Páginas del listado' }}">
    {% if pagina.has_previous %}<a class="btn btn-secondary btn-small" href="{{ pagina.url_anterior }}">Anterior</a>{% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
    {% if pagina.has_next %}<a class="btn btn-secondary btn-small" href="{{ pagina.url_siguiente }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
